name: Python Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        id: tests
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
        run: pytest tests/tests_zooplus/ --alluredir=allure-results

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.22.0
          wget -qO /tmp/allure.zip \
            https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip
          unzip -qq /tmp/allure.zip -d /opt/
          echo "/opt/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH

      - name: Verify Allure
        id: allure
        run: allure --version

      - name: Generate allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Upload allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

      - name: Upload trace files for failed cases
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: traces
          path: test-results
          retention-days: 7
